<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Place</title>
</head>
<body>
<form action="addPlace" method="post">
    <input name="title" placeholder="Title" required>
    <!-- photo_id ожидается как Long, ставим type="number" и required, чтобы не было NumberFormatException -->
    <input name="photo_id" type="number" placeholder="Photo ID" required>
    <input name="description" placeholder="Description">
    <input name="street_address" placeholder="Street Address">
    <input type="submit" value="Add Place">
</form>
</body>
</html>
